services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: nova_scholar
      POSTGRES_USER: nova_scholar
      POSTGRES_PASSWORD: local-development-password
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nova_scholar -d nova_scholar"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.29
    ports:
      - "1025:1025"
      - "8025:8025"

  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: nova_scholar
      MINIO_ROOT_PASSWORD: local-development-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  tika:
    image: apache/tika:3.3.1.0
    ports:
      - "127.0.0.1:9998:9998"
    healthcheck:
      test: ["CMD-SHELL", "wget --spider --quiet http://127.0.0.1:9998/version"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  minio-data:
  postgres-data:
  redis-data:
